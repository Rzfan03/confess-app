app = "bisik"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[mounts]
  source = "bisik_data"
  destination = "/app/backend"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
  memory_swap_mb = 512
